# Esteira do app (ADR-0013): verifica num runner do GitHub e publica o bundle JS como atualização
# OTA no runner self-hosted do homeserver, direto na pasta que a API serve. O APK não sai daqui
# (o build nativo é na máquina do autor, `npm run apk:publicar`); se o commit mudou algo nativo, o
# job pula a publicação e avisa no resumo.
#
# Mesmo cuidado do api.yml: repositório público, nada roda em pull_request, e o runner da casa só
# recebe push na main ou disparo manual na main.
name: App

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; um push novo espera a anterior terminar.
concurrency:
  group: app-ota
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w @compasso/core -w @compasso/mobile
      - run: npm test -w @compasso/core

  publicar-ota:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, compasso]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Escreve em ~/compasso/releases/ota, que o container da API lê (deploy/compose.yml).
      - run: npm run ota:publicar -w @compasso/mobile
